services:
  postgres:
    image: postgres:17-alpine
    container_name: block-nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blocknexus}
      POSTGRES_USER: ${POSTGRES_USER:-blocknexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blocknexus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blocknexus} -d ${POSTGRES_DB:-blocknexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
